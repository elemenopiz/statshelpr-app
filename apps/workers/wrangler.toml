name = "statshelpr-api"
main = "src/index.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat"]

# Runtime env vars (non-secret). Secrets set via `wrangler secret put NAME`.
[vars]
LLM_PROVIDER = "openai"
FREE_TIER_DAILY_LIMIT = "5"
LEMONSQUEEZY_STORE_ID = "300628"
LEMONSQUEEZY_VARIANT_ID = "1929562"
# Assumed solves/user/month for GET /api/metrics's economics.grossMarginPerUserPct
# estimate only (COGS vs price — not a cap or rate limit). 110 = the documented
# paid-user usage assumption (~10 solves / 2 weekdays).
AVG_SOLVES_PER_USER_PER_MONTH = "110"

# Dashboard hides all daily metrics buckets dated before this (UTC) — hides
# founder dev/testing data from the live dashboard without deleting it from KV.
METRICS_LAUNCH_DATE = "2026-07-25"

# Base URL of the Cloud Run R-runner service (r-runner/) that executes calc
# questions' R code server-side — see docs/cloud-run-r-migration.md. Non-secret
# (the URL alone grants nothing without the R_RUNNER_SECRET header — see the
# secrets block below); lib/r-runner.ts's runRRemote POSTs `${R_RUNNER_URL}/runR`.
# *** REPLACE with the real Cloud Run URL after the first `gcloud run deploy`
# (see r-runner/README.md) — this placeholder host is deliberately fake so a
# forgotten replacement fails loudly (DNS/connection error) instead of
# silently misrouting every calc question. ***
R_RUNNER_URL = "https://statshelpr-r-runner-964221203874.us-central1.run.app"

# --- Abuse-hole closing (security audit, 2026-07-22) — see lib/rate-limit.ts
# and lib/kill-switch.ts for the full rationale behind the two below. Neither
# changes pricing/tiers/the 5/day free cap — they're purely anti-abuse
# backstops layered around it. (A third, per-install-id daily cap that used
# to live here — gating the old standalone /api/interpret route on its own —
# was retired along with that route: docs/cloud-run-r-migration.md §3. The
# interpret pass is now an internal leg of /api/solve, already covered by
# IP_DAILY_LIMIT and the per-install counter below, same as the rest of that
# request.)
#
# Per-IP daily cap, applied on top of the per-install counter on /api/solve —
# a backstop against trivial install-id rotation (the install id is just a
# client-picked crypto.randomUUID(), see apps/extension/src/install-id.ts,
# with no server issuance, so it resets for free). Sized to be generous for
# shared-NAT campus WiFi (200 solve calls/day from one IP ~= 40 distinct free
# users each maxing out their own 5/day cap, or many more if most don't)
# while still bounding a single-IP install-id-rotation script to a small,
# known fraction (well under half) of the global ceiling below. Only applied
# to free-tier callers — paid licenses stay unlimited, same as the
# per-install counter.
IP_DAILY_LIMIT = "200"
# Global (NOT per-user) daily ceiling on every Gemini call this Worker makes,
# checked before EACH ONE individually regardless of caller/tier — the real
# volume/cost backstop the audit flagged as missing (previously: only a
# daily 08:00 UTC alert EMAIL after the fact, nothing in the request path
# itself). A calc question can trip this check up to three times inside ONE
# /api/solve request (first pass, an optional R-repair retry, interpret) now
# that the interpret pass is no longer its own route — see
# docs/cloud-run-r-migration.md §3 — so per-call (not per-request) checking
# still bounds worst-case spend the same way it did when solve and interpret
# were separate requests. At the pessimistic per-call cost assumed in
# lib/kill-switch.ts ($0.08 — worst-case model/token mix, not typical
# traffic), 2500 calls/day bounds worst-case ADVERSARIAL exposure at ~$200/day
# — reaching that requires a deliberate attacker maxing token cost per call
# across 13+ rotating IPs (IP_DAILY_LIMIT bounds each one); the same 2500
# calls of ORGANIC flash-lite traffic costs ~$15–25. Sized for the launch
# target (2026-07-29 capacity review): one 30-student class session solving a
# ~10-question calc-heavy quiz burns 600–900 calls (~$4–6 real cost), so 2500
# covers a full section plus a second one the same UTC day with headroom —
# the prior 1000 would have tripped a service-wide 503 mid-second-section.
# Raise again as real traffic grows past this.
GLOBAL_DAILY_CALL_LIMIT = "2500"
# Global daily ceiling on ACTUAL Gemini dollars (2026-07-29) — the hard
# answer to "most a bad day can cost". Every solve leg reports its real
# costUsd (lib/cost.ts rates on Gemini's returned usage) into the same
# kill-switch gate; once the day's accumulated spend crosses this, further
# Gemini calls 503 until the 24h window rolls, exactly like the call ceiling
# above. The $200 adversarial figure above therefore no longer binds — the
# worst day is ~this value plus single-digit dollars of in-flight overshoot.
# 25 = ~5x a full 30-student class day (~$4–6), so organic use never trips
# it; raise alongside real growth. See lib/kill-switch.ts.
GLOBAL_DAILY_SPEND_LIMIT_USD = "25"

# KV binding for licenses, rate limiting, feedback, LS webhook idempotency,
# and clickwrap assent records (`assent:{installId}:{tosVersion}`, written by
# routes/assent.ts). NO NEW NAMESPACE for assent: every other subject-keyed
# record in this product (`claim:{installId}`, licenses, counters) already
# lives here under its own key prefix, and a second namespace would buy
# nothing — Workers KV has no cross-namespace isolation that a prefix doesn't
# already give. Note the assent prefix carries a ~7-year TTL, far longer than
# anything else in here; see the RETENTION_TTL_SECONDS comment in
# routes/assent.ts for why.
# Create with: wrangler kv namespace create statshelpr
# Then replace the id below with the printed id.
[[kv_namespaces]]
binding = "STATSHELPR_KV"
id = "23d6ef6041854bec96fd277cb013e7e6"

# CountersDO — every hot counter (per-install free cap, per-IP backstop,
# global call + dollar ceilings) lives in this ONE SQLite-backed Durable
# Object instead of KV (DO switch, 2026-07-29): the account's KV free plan
# allows 1,000 writes/day total and 1 write/sec per key, both of which a
# 30-student class session blows through; DOs are free-plan-included and
# serialize access, making the counters exact. `new_sqlite_classes` (NOT
# `new_classes`) is REQUIRED — the free plan only supports SQLite-backed
# DOs. See apps/workers/src/lib/counters-do.ts for the full design.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CountersDO"]

[[durable_objects.bindings]]
name = "COUNTERS_DO"
class_name = "CountersDO"

# Secrets set at deploy time (not committed):
#   wrangler secret put OPENAI_API_KEY               (THE solver key — required;
#                                                     GEMINI_API_KEY is retired and
#                                                     unread; delete it whenever convenient)
#   wrangler secret put LEMONSQUEEZY_API_KEY
#   wrangler secret put LEMONSQUEEZY_WEBHOOK_SECRET
#   wrangler secret put LEMONSQUEEZY_STORE_ID       (optional; enforces store match)
#   wrangler secret put LEMONSQUEEZY_VARIANT_ID     (optional; enforces variant match)
#   wrangler secret put RESEND_API_KEY              (required for POST /api/reset/request —
#                                                     LS has no buyer self-reset portal, so
#                                                     device-reset emails go via Resend; also
#                                                     verify the "statshelpr.com" sending domain
#                                                     in the Resend dashboard or sends 403)
#   wrangler secret put METRICS_TOKEN               (required for GET /api/metrics — bearer
#                                                     token; generate with e.g. `openssl rand
#                                                     -hex 32`. Unset = route hard-fails closed.)
#   wrangler secret put DASHBOARD_PASSWORD           (required for GET /dashboard — access key
#                                                     checked against ?key= or a cookie it sets;
#                                                     generate with e.g. `openssl rand -hex 32`.
#                                                     Unset = route hard-fails closed, including
#                                                     ?demo=1.)
#   wrangler secret put ALERT_EMAIL                  (recipient for the scheduled founder-metrics
#                                                     threshold alerts — see [triggers] below and
#                                                     lib/alerts.ts. Unset (or RESEND_API_KEY unset)
#                                                     = alerting skipped silently; the daily
#                                                     snapshot rollup still runs.)
#   wrangler secret put R_RUNNER_SECRET              (*** REQUIRED — MUST BE SET BEFORE DEPLOY ***
#                                                     shared secret between this Worker and the Cloud
#                                                     Run R-runner service — sent as the
#                                                     X-Runner-Secret header on every POST /runR (see
#                                                     lib/r-runner.ts). MUST be the SAME value passed
#                                                     to Cloud Run's own R_RUNNER_SECRET env var at
#                                                     `gcloud run deploy` (see r-runner/README.md and
#                                                     docs/cloud-run-r-migration.md §2.3/§3.4).
#                                                     Generate with e.g. `openssl rand -hex 32`.
#                                                     Unset = calc questions fail closed with a clear
#                                                     "R runner not configured" error — same
#                                                     fail-closed contract as DASHBOARD_PASSWORD/
#                                                     METRICS_TOKEN above, NOT an open gate; concept
#                                                     questions are unaffected. Also set R_RUNNER_URL
#                                                     in [vars] above — both are required.)
#   wrangler secret put ACTIVATION_HASH_SECRET       (*** REQUIRED — MUST BE SET BEFORE DEPLOY ***
#                                                     HMAC key for every license-activation KV hash
#                                                     (lib/license-activation.ts's activationHash).
#                                                     Generate with e.g. `openssl rand -hex 32`, and
#                                                     do NOT reuse any other secret's value. Keeps the
#                                                     activation hash space disjoint from
#                                                     lib/rate-limit.ts's unkeyed hashBucket, so a raw
#                                                     license key (whose `license:` record carries the
#                                                     buyer email) can no longer be turned into that
#                                                     customer's install hash and joined against the
#                                                     daily `installHashes` sets in the metrics
#                                                     buckets. Unset = activation fails closed with a
#                                                     clear "Activation not configured" reason, same
#                                                     contract as R_RUNNER_SECRET above — paid solves
#                                                     would be rejected, so set it BEFORE deploying.
#                                                     Set-once: rotating it costs one LS /activate
#                                                     round-trip per active install. Existing
#                                                     activations written under the old unsalted hash
#                                                     migrate themselves on first use — see that
#                                                     module's header.)
#   wrangler secret put GCP_MONITORING_SA_KEY        (OPTIONAL — full JSON key file, verbatim, for
#                                                     the read-only statshelpr-monitoring-reader@...
#                                                     service account, roles/monitoring.viewer ONLY.
#                                                     Powers the /dashboard "Cloud Run Infra" panel
#                                                     (lib/gcp-monitoring.ts) — free-tier burn +
#                                                     cold-start latency pulled live from GCP Cloud
#                                                     Monitoring. NOT fail-closed: unset just renders
#                                                     that one panel as "unavailable", same as a GCP
#                                                     outage or expired key — every other panel is
#                                                     unaffected. Not present in any .dev.vars in this
#                                                     repo; local dev simply runs without it.)

# Cron trigger — drives the `scheduled` handler in src/index.ts, which (a)
# rolls up a compact daily KPI snapshot (`snapshot:YYYY-MM-DD`) so trends
# survive the raw buckets' TTL, and (b) evaluates threshold alerts and emails
# them via Resend (needs the ALERT_EMAIL + RESEND_API_KEY secrets above;
# alerting is skipped silently if either is unset). Runs daily at 08:00 UTC.
[triggers]
crons = ["0 8 * * *"]

# Custom domain — statshelpr.com is already in this Cloudflare account so
# `custom_domain = true` auto-creates the AAAA record + provisions SSL.
[[routes]]
pattern = "api.statshelpr.com"
custom_domain = true
